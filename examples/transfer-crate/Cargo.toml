[workspace]
[package]
name = "transfer-crate"
version = "0.1.0"
edition = "2021"
publish = false

# Specify lib target explicitly for clarity if needed, though Cargo usually infers it
[lib]
crate-type = ["cdylib", "lib"] # Keep existing types

[features]
default = ["no_std"]
std = ["solana-account-info", "solana-entrypoint", "solana-cpi", "solana-program-error", "solana-pubkey", "solana-system-interface"]
solana-program = ["solana-account-info", "solana-entrypoint", "solana-cpi", "solana-program-error", "solana-pubkey", "solana-system-interface"]
solana-program-mono = ["dep:solana-program"]
solana-nostd-entrypoint = ["solana-nostd-entrypoint-dep", "solana-program-error", "solana-cpi", "solana-system-interface"]
no_std = ["pinocchio"]
provide-handlers = []

[dependencies]
pinocchio = { version = "0.8", git = "https://github.com/rustopian/pinocchio.git", branch = "rustopian/slot-hashes-sysvar", optional = true }
solana-account-info = { version = "2.2.1", default-features = false, optional = true }
solana-entrypoint = { package = "solana-program-entrypoint", version = "2.2.1", default-features = false, optional = true }
solana-cpi = { version = "2.2.1", default-features = false, optional = true }
solana-program-error = { version = "2.2.2", default-features = false, optional = true }
solana-pubkey = { version = "2.2.1", default-features = false, optional = true }
solana-system-interface = { version = "1.0.0", default-features = false, features = ["bincode"], optional = true }
solana-program = { version = "2.2.0", default-features = false, optional = true }
solana-nostd-entrypoint-dep = { package = "solana-nostd-entrypoint", version = "0.6", default-features = false, optional = true } 
